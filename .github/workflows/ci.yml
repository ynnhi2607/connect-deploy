name: Deploy Config CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MYSQL_DATABASE: connectspace
      MYSQL_USER: connect
      MYSQL_PASSWORD: ci-only-mysql-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JWT_TTL_HOURS: "24"
      CORS_ALLOWED_ORIGINS: http://localhost:3002

      BACKEND_IMAGE: ghcr.io/ynnhi2607/connect-be
      BACKEND_TAG: develop
      FRONTEND_IMAGE: ghcr.io/ynnhi2607/connect-frontend
      FRONTEND_TAG: develop
      HTTP_PORT: "3002"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Show Docker Compose version
        run: docker compose version

      - name: Ensure secret environment files are not tracked
        run: |
          tracked_files="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)' |
              grep -vE '\.example$' || true
          )"

          if [ -n "$tracked_files" ]; then
            echo "Secret environment files are tracked:"
            echo "$tracked_files"
            exit 1
          fi

      - name: Validate local Compose
        run: docker compose -f compose.yaml config --quiet

      - name: Validate production Compose
        run: docker compose -f compose.prod.yaml config --quiet