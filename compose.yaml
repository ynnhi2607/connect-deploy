name: connect

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - database

  backend:
    build:
      context: ../be
      dockerfile: Dockerfile

    image: connect-backend:dev
    restart: unless-stopped

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - application
      - database

  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile

    image: connect-frontend:dev
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
            "CMD",
            "wget",
            "--quiet",
            "--tries=1",
            "--spider",
            "http://127.0.0.1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      - "127.0.0.1:3000:80"
    networks:
      - application

volumes:
  mysql_data:

networks:
  application:
    driver: bridge
  database:
    driver: bridge

