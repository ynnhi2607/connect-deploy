name: connect-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 384m

    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --max-connections=30
      - --table-open-cache=200
      - --thread-cache-size=4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-connectspace}
      MYSQL_USER: ${MYSQL_USER:-connect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - database

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${BACKEND_TAG:?BACKEND_TAG is required}"
    pull_policy: always
    restart: unless-stopped
    mem_limit: 448m

    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx224m -Xss256k -XX:MaxMetaspaceSize=96m
        -XX:+UseSerialGC
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-connectspace}
      DB_USERNAME: ${MYSQL_USER:-connect}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

    networks:
      - application
      - database

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}:${FRONTEND_TAG:?FRONTEND_TAG is required}"
    pull_policy: always
    restart: unless-stopped
    mem_limit: 64m

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      - "${HTTP_PORT:-80}:80"

    networks:
      - application

volumes:
  mysql_data:

networks:
  application:
    driver: bridge

  database:
    driver: bridge
    internal: true